name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (incl. dev)
        run: |
          pip install -e ".[dev]"
          pip install pytest-cov
          python -m pip list
      - name: Tests (mocks, no Banxico quota used)
        run: |
          python -m pytest tests/ -v --tb=short
      - name: Lint
        run: ruff check src/ tests/
